# Production override for one Oracle Always Free VM (see docs/DEPLOY.md):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Only Caddy is reachable from outside (80/443). Postgres, Redis and MLflow listen on the VM's
# loopback only, so backups and the PC fallback (SSH tunnel) can reach them; app ports are internal.

services:
  db:
    ports: !override ["127.0.0.1:5432:5432"]
  redis:
    ports: !override ["127.0.0.1:6379:6379"]
  mlflow:
    ports: !override ["127.0.0.1:5000:5000"]
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,host.docker.internal:15000
  api:
    ports: !reset []
    environment:
      HOOPSAI_CORS_ORIGINS: '["https://${DOMAIN:?set DOMAIN in .env}"]'
  web:
    ports: !reset []
    environment:
      API_PUBLIC_WS_URL: wss://${DOMAIN:?set DOMAIN in .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # TLS certificates; keep across restarts
    depends_on: [api, web]

volumes:
  caddy_data:
