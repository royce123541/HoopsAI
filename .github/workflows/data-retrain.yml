name: Weekly retrain

# Mondays: backtest and refit the pre-game model; it replaces production only if it scores
# better on the latest held-out season (hoopsai.ml.registry).
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

jobs:
  retrain:
    uses: ./.github/workflows/hoopsai-job.yml
    with:
      command: job retrain
      timeout-minutes: 120
    secrets: inherit
