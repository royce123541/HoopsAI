[project]
name = "hoopsai"
version = "0.1.0"
description = "HoopsAI backend: NBA data ingestion, win-probability models, and API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "redis>=8.1",
    "typer>=0.27",
    "nba-api>=1.11",
    "apscheduler>=3.11,<4",
    "pandas>=3.0",
    "numpy>=2.3",
    "scikit-learn>=1.9",
    "lightgbm>=4.7",
    "mlflow-skinny>=3.16,<4",
    "tzdata>=2025.2",
]

[project.scripts]
hoopsai = "hoopsai.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hoopsai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # autogenerated

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nba_api.*", "apscheduler.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Emitted by MLflow's own modules at import time (mlflow/types/responses.py), not ours.
    "ignore:.*Any type hint is inferred as AnyType:UserWarning",
]
